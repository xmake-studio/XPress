name: Release

# Push a tag like v1.2.3 to build signed APKs and publish them as a GitHub Release.
# Running it by hand (workflow_dispatch) builds the same APKs as an artifact, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # 1.2.3 -> 10203; pre-release suffixes (1.2.3-beta) share the code of their base.
          IFS=. read -r major minor patch <<< "${name%%-*}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          [[ $code -gt 0 ]] || code=$GITHUB_RUN_NUMBER
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Collect APKs
        run: |
          mkdir dist
          for abi in arm64-v8a x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/XPress-${{ steps.version.outputs.name }}-$abi.apk"
          done
          ls -l dist
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: XPress-${{ steps.version.outputs.name }}
          path: dist/*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          {
            echo "## Установка"
            echo
            echo "- **XPress-$VERSION-arm64-v8a.apk** — для телефонов (практически все Android-устройства)."
            echo "- **XPress-$VERSION-x86_64.apk** — для эмуляторов и x86-планшетов."
            echo
            echo "Android 10 и новее."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "XPress $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease
